services:

  scraper:
    build:
      context: .
      dockerfile: Dockerfile
    image: github-trending-scraper
    container_name: github_trending_container
    stdin_open: true
    tty: true
    depends_on:
      - psql-db
    volumes:
      - .:/app

  psql-db:
    image: postgres:14
    container_name: psql-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: github_trending
    ports:
      - "5434:5432"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: github-trending-web
    container_name: github_trending_web
    command: python app.py
    depends_on:
      - psql-db
    ports:
      - "5000:5000"
    volumes:
      - .:/app
