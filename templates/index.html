<!DOCTYPE html>
<html>
<head>
    <title>GitHub Trending Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #222;
            color: white;
        }

        a {
            text-decoration: none;
        }
    </style>
</head>

<body>

    <h1>GitHub Trending Dashboard</h1>

    <p>
        Repositories found: {{ repositories|length }}
    </p>

    <table>

        <tr>
            <th>Rank</th>
	    <th>Username</th>
            <th>Repository</th>
            <th>Language</th>
            <th>Total Stars</th>
            <th>Stars Today</th>
            <th>Link</th>
        </tr>

        {% for repo in repositories %}

        <tr>
            <td>{{ loop.index }}</td>

            <td>{{ repo[0] }}</td>
	     <td>{{ repo[1]}}</td>

            <td>
                {{ repo[2] }}
            </td>

            <td>
                {{ repo[3] }}
            </td>

            <td>
                +{{ repo[4] }}
            </td>

            <td>
                <a href="{{ repo[5] }}" target="_blank">
                    View
                </a>
            </td>
        </tr>

        {% endfor %}

    </table>

</body>
</html>
